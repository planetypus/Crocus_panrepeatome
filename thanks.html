<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you</title>
  <style>
    :root { --bg: #faf8fc; --text: #1f1a24; --muted: #5e5668; --accent: #7b4fa8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16131a; --text: #efeaf4; --muted: #b3a9bf; --accent: #b48ce0; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    h1 { color: var(--accent); }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Thank you!</h1>
  <p>Your message was sent. If you left your email, I'll get back to you.</p>
  <p><a href="./">Back to the Crocus pan-repeatome</a></p>
</main>
</body>
</html>
