<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crocus pan-repeatome</title>
  <meta name="description" content="Crocus pan-repeatome: phylogeny and repeat clades across 41 taxa. Leave a question or comment.">
  <style>
    :root {
      --bg: #faf8fc; --surface: #ffffff; --text: #1f1a24; --muted: #5e5668;
      --accent: #7b4fa8; --accent-strong: #5f3a85; --border: #e2dbe9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16131a; --surface: #211d27; --text: #efeaf4; --muted: #b3a9bf;
        --accent: #b48ce0; --accent-strong: #cba8f0; --border: #3a3343;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; color: var(--accent-strong); }
    .sub { color: var(--muted); margin: 0 0 20px; }
    figure { margin: 0 0 8px; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    figure img { display: block; width: 100%; height: auto; }
    .imglinks { font-size: .9rem; color: var(--muted); margin: 0 0 32px; }
    a { color: var(--accent); }
    section.form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    h2 { font-size: 1.25rem; margin: 0 0 4px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    .opt { font-weight: 400; color: var(--muted); }
    input, textarea {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    textarea { min-height: 140px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      margin-top: 16px; padding: 11px 22px; font: inherit; font-weight: 600;
      color: #fff; background: var(--accent-strong); border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .hp { position: absolute; left: -9999px; }
    footer { margin-top: 28px; font-size: .85rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>Crocus pan-repeatome</h1>
  <p class="sub">Phylogeny and repeat clades across <em>Crocus</em> and the outgroup <em>Romulea</em>.</p>

  <figure>
    <a href="images/Website_crocus_web.jpg">
      <img src="images/Website_crocus_web.jpg" width="3000" height="3353"
           alt="Circular phylogeny of 41 Crocus taxa and the outgroup Romulea, with flower photos grouped into repeat clades A to Z and colored by subgenus.">
    </a>
  </figure>
  <p class="imglinks">Tap the image to zoom. <a href="images/Website_crocus.png">Full-resolution PNG</a> (35 MB).</p>

  <section class="form">
    <h2>Questions or comments</h2>
    <p class="sub" style="margin:0">I'd love to hear from you. Your message goes straight to my inbox.</p>
    <form action="https://formsubmit.co/waminal@ipk-gatersleben.de" method="POST">
      <input type="hidden" name="_subject" value="PSC_Symposium_Poster_Response">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://planetypus.github.io/Crocus_panrepeatome/thanks.html">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <label for="name">Name <span class="opt">(optional)</span></label>
      <input id="name" name="name" type="text" autocomplete="name">

      <label for="email">Email <span class="opt">(optional, if you'd like a reply)</span></label>
      <input id="email" name="email" type="email" autocomplete="email">

      <label for="message">Your question or comment</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>

  <footer>Nomar Waminal · PSC Symposium, Zürich 2026</footer>
</main>
</body>
</html>
